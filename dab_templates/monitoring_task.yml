resources:
  jobs:
    monitoring_job:
      name: ${var.project_name}-monitoring_job
      permissions:
        - level: CAN_VIEW
          group_name: users
      job_clusters:
        - job_cluster_key: ${var.project_name}-monitoring_job_cluster
          new_cluster:
            num_workers: 0
            spark_conf:
              "spark.databricks.cluster.profile": "singleNode"
              "spark.master": "local[*, 4]"
            instance_pool_id: ${var.internal_instance_pool_id}
            spark_version: 16.4.x-cpu-ml-scala2.13
            custom_tags:
              "ResourceClass": "SingleNode"
            data_security_mode: "SINGLE_USER"
      tasks:
        - task_key: monitoring
          job_cluster_key: ${var.project_name}-monitoring_job_cluster
          notebook_task:
            notebook_path: ${var.notebook_path}
            base_parameters:
              environment: ${bundle.target}
              environment_full_name: ${var.environment_full_name}
              experiment_name: ${var.experiment_name}
              schema_name: ${var.schema_name}
              catalog_type: ${var.catalog_type}
              ci_code: ${var.ci_code}
              sql_warehouse_id: ${var.sql_warehouse_id}
              lookback_window: ${var.lookback_window}
              client_id: ${var.client_id}
              tenant_id: ${var.tenant_id}
      schedule:
        quartz_cron_expression: ${var.monitoring_job_cron}
        timezone_id: UTC
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${var.email_notifications}
